name: Build & Release Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Android & Android TV Build (Temporarily skipped in v1.0.0; re-enabling in v2.0.0)
  # -------------------------------------------------------------
  build-android:
    name: Build Android & TV APKs
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Dart Analyzer
        run: dart analyze

      - name: Setup Release Keystore (if secrets configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "Release keystore configured."
          else
            echo "No release keystore secrets set; falling back to debug signing."
          fi

      - name: Build Split APKs (Optimized per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Package & Rename Android APKs
        run: |
          mkdir -p release-android
          cp build/app/outputs/flutter-apk/app-release.apk release-android/AteX_Music-Android-Universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-android/AteX_Music-Android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-android/AteX_Music-Android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-android/AteX_Music-Android-x86_64.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: release-android/*
          if-no-files-found: error

  # -------------------------------------------------------------
  # Windows x64 Build (Portable ZIP + Inno Setup Installer)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-windows
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "release-windows\AteX_Music-Windows-x64-Portable.zip" -CompressionLevel Optimal

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\atex_music_setup.iss
          Copy-Item "windows\installer\Output\AteX_Music-Setup-Windows-x64.exe" -Destination "release-windows\"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release-windows/*
          if-no-files-found: error

  # -------------------------------------------------------------
  # Unsigned iOS IPA Build (AltStore / SideStore / Scarlet)
  # -------------------------------------------------------------
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p release-ios/Payload
          cp -R build/ios/iphoneos/Runner.app release-ios/Payload/
          cd release-ios
          zip -r -9 AteX_Music-iOS-Unsigned.ipa Payload
          cd ..

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: release-ios/AteX_Music-iOS-Unsigned.ipa
          if-no-files-found: error

  # -------------------------------------------------------------
  # macOS App Build
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS ZIP
        run: |
          mkdir -p release-macos
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -n 1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" release-macos/AteX_Music-macOS.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: release-macos/AteX_Music-macOS.zip
          if-no-files-found: error

  # -------------------------------------------------------------
  # GitHub Release Publication & SHA-256 Checksums
  # -------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-ios, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Android build is temporarily skipped in v1.0.0; re-enabling in v2.0.0
      # - name: Download Android Artifacts
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: android-apks
      #     path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release-assets

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-zip
          path: release-assets

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cd ..

      - name: Display Release Assets
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          name: AteX Music ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            # AteX Music ${{ github.ref_name }} — Flagship Production Release
            **100% Offline-First, Zero-Server Multi-Platform Music Player.**

            ---

            ### 📦 Choosing the Right Binary for Your Device:

            | Platform / Device | Recommended Binary | Description |
            | :--- | :--- | :--- |
            | **Windows (Installer)** | `AteX_Music-Setup-Windows-x64.exe` | One-click setup wizard with Start Menu and Desktop shortcuts |
            | **Windows (Portable)** | `AteX_Music-Windows-x64-Portable.zip` | Extract and run anywhere without admin rights or installation |
            | **macOS** | `AteX_Music-macOS.zip` | Standalone `.app` bundle for Apple Silicon and Intel Macs |
            | **iOS (Sideload)** | `AteX_Music-iOS-Unsigned.ipa` | Sideload via AltStore, SideStore, TrollStore, or Scarlet |
            | **Checksums** | `SHA256SUMS.txt` | Cryptographic SHA-256 hashes to verify binary integrity |

            > **Note**: Android and Android TV APK builds are temporarily skipped in `v1.0.0` and will be officially enabled in `v2.0.0`.

            ---

            ### ✨ Highlights in this Release:
            - **Real Full-Length Audio Stream Resolver**: Resolves high-bitrate Opus / M4A streams for trending charts and searches.
            - **Offline Downloader with LRCLIB Synced Lyrics**: Download full audio, 600x600 cover art, and `.lrc` karaoke lyrics for true Airplane Mode listening.
            - **Universal Playlist Importer**: Paste Spotify, YouTube Music, or Amazon Music playlist links directly into SQLite storage.
            - **Native Audio DSP & Equalizer**: Real Skip Silence, pitch shifting, speed controls (0.5x - 2.0x), and auto-pause sleep timer.
            - **Storage Cache Manager**: Real-time MB calculation and 1-tap cache cleaner.
            - **Curated Pro Themes**: Studio Obsidian, Pure AMOLED, Midnight Cobalt, Crimson Vinyl, and Emerald Studio with custom blurred wallpapers.