name: Build & Release Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Android & Android TV Build
  # -------------------------------------------------------------
  build-android:
    name: Build Android & TV APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Dart Analyzer
        run: dart analyze

      - name: Build Split APKs (Android & Android TV)
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          mkdir -p release-android
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-android/AteX_Music-Android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-android/AteX_Music-Android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-android/AteX_Music-Android-x86_64.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: release-android/*
          if-no-files-found: error

  # -------------------------------------------------------------
  # Windows x64 Build
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-windows
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "release-windows\AteX_Music-Windows-x64.zip" -CompressionLevel Optimal

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release-windows/AteX_Music-Windows-x64.zip
          if-no-files-found: error

  # -------------------------------------------------------------
  # Unsigned iOS IPA Build
  # -------------------------------------------------------------
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p release-ios/Payload
          cp -R build/ios/iphoneos/Runner.app release-ios/Payload/
          cd release-ios
          zip -r -9 AteX_Music-iOS-Unsigned.ipa Payload
          cd ..

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: release-ios/AteX_Music-iOS-Unsigned.ipa
          if-no-files-found: error

  # -------------------------------------------------------------
  # macOS App Build
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS ZIP
        run: |
          mkdir -p release-macos
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -n 1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" release-macos/AteX_Music-macOS.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: release-macos/AteX_Music-macOS.zip
          if-no-files-found: error

  # -------------------------------------------------------------
  # GitHub Release Publication
  # -------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows, build-ios, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release-assets

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-zip
          path: release-assets

      - name: Display Release Assets
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          name: AteX Music ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## AteX Music Release
            100% offline-first, zero-server, multi-platform music player.

            ### Included Release Binaries:
            - **Android & Android TV**: `AteX_Music-Android-armeabi-v7a.apk`, `AteX_Music-Android-arm64-v8a.apk`, `AteX_Music-Android-x86_64.apk`
            - **Windows x64**: `AteX_Music-Windows-x64.zip`
            - **iOS**: `AteX_Music-iOS-Unsigned.ipa`
            - **macOS**: `AteX_Music-macOS.zip`
