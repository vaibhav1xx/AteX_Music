name: atex_music
description: "AteX Music - 100% offline-first, zero-server, multi-platform music player."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.5
  path: ^1.9.1
  dio: ^5.8.0+1
  palette_generator: ^0.3.3+6
  cupertino_icons: ^1.0.8
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1

  # Flagship UI & Typography
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^4.0.3
  cached_network_image: ^3.4.1
  window_manager: ^0.4.3

  # Database (Drift + SQLite)
  drift: ^2.24.2
  sqlite3_flutter_libs: ^0.5.28

  # Audio Engine & Background Service
  just_audio: ^0.9.46
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  audio_service: ^0.18.18
  audio_session: ^0.1.25

  # Platform-Safe Music Scanning
  on_audio_query: ^2.9.0
  file_picker: ^8.1.7
  audio_metadata_reader: ^1.0.3
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#09090B"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
